# ##################################################################
#                   MERIDIAN ROLEPLAY - SERVER.CFG                 #
#                   "Every Choice Shapes the State"                #
# ##################################################################

## Server Endpoints
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

## Server Identity & Info
sv_hostname "Meridian Roleplay | Semi-Serious RP | State of Meridian"
sets sv_projectName "Meridian Roleplay"
sets sv_projectDesc "A modular, interconnected, semi-serious FiveM roleplay experience."
sets locale "id-ID,en-US"
sets tags "roleplay, qbcore, meridian, economy, serious, indonesia, english"
sv_maxclients 48

## Steam Web API Key & Server License Key
# set steam_webApiKey "YOUR_STEAM_WEB_API_KEY"
sv_licenseKey "CHANGE_ME_IN_SERVER_CFG_LOCAL"

## Include local uncommitted credentials if present
exec server.cfg.local

## Database Connection String (oxmysql)
## Target: Local MariaDB/MySQL (XAMPP default port 3306)
set mysql_connection_string "mysql://root:@localhost/meridian_rp?charset=utf8mb4"
set mysql_slow_query_warning 150
set mysql_debug "false"

## Framework & Inventory Flags
setr ox:locale "en"
setr inventory:framework "qb"
setr inventory:slots 50
setr inventory:weight 30000

## Voice System Configuration (pma-voice recommended)
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_defaultCycle "Z"
setr voice_enableSubmix 1

# ##################################################################
#                   RESOURCE EXECUTION ORDER                       #
# ##################################################################

## 1. CFX Default Base
ensure mapmanager
ensure chat
ensure spawnmanager
ensure basic-gamemode
ensure baseevents

## 2. Low-Level Database & Core Dependencies
ensure oxmysql
ensure ox_lib

## 3. Standalone Utilities & Libraries
ensure PolyZone

## 4. Core Framework & Character Creation
ensure qb-core
ensure qb-clothing
ensure qb-multicharacter
ensure qb-spawn

## 5. Item & Inventory Management
ensure qb-weapons
ensure qb-inventory

## 6. Meridian Core & Shared Foundations
ensure meridian-core

## 7. Meridian Economy & Civilian Life
ensure meridian-banking
ensure meridian-businesses
ensure meridian-civilian

## 8. Meridian Public Safety & Legal Workflow
ensure meridian-emergency
ensure meridian-justice

## 9. Meridian Criminal Ecosystem
ensure meridian-organizations

## 10. Meridian User Interface
ensure meridian-ui

# ##################################################################
#                   PERMISSIONS & ACE CONTROLS                     #
# ##################################################################
add_ace resource.qb-core command.add_ace allow
add_ace resource.qb-core command.add_principal allow
add_ace resource.qb-core command.remove_principal allow

add_ace group.admin command allow
add_ace group.admin command.quit deny
add_principal identifier.fivem:1 group.admin
